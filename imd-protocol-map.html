<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>From request to reward · Moni research</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"><style>
html,body{margin:0;padding:0;background:transparent}
#imd{--bg:#ffffff;--soft:#fafafb;--text:#14151a;--body:#3b4049;--muted:#8b8f99;--line:#e8e8ed;--accent:#6c42eb;--accent-soft:#6c42eb14;--emerald:#0fa968;font-family:Geist,system-ui,sans-serif;color:var(--body);background:var(--bg);width:100%;max-width:none;overflow:hidden;line-height:1.5}
#imd *{box-sizing:border-box;min-width:0}
#imd .hd{padding:20px 22px 14px}
#imd .kick{font:600 9px/1.2 'IBM Plex Mono',monospace;letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
#imd h2{margin:7px 0 6px;font:700 25px/1.12 Geist,sans-serif;letter-spacing:-.025em;color:var(--text)}
#imd .sub{margin:0;font-size:12px;line-height:1.45}
#imd .body{padding:0 22px 18px}
#imd .tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
#imd button{font:500 11px/1.3 Geist,sans-serif;padding:7px 10px;border:1px solid var(--line);background:var(--bg);color:var(--body);cursor:pointer}
#imd button:hover{border-color:var(--accent)}
#imd button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
#imd button:focus-visible,#imd input:focus-visible,#imd summary:focus-visible,#imd a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#imd .mets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
#imd .met{border:1px solid var(--line);padding:11px 12px;background:var(--bg)}
#imd .met .l{font-size:10px;color:var(--muted)}
#imd .met .n{font:700 23px/1.25 Geist,sans-serif;color:var(--text);letter-spacing:-.025em;margin-top:4px;overflow-wrap:anywhere}
#imd .met.hero{background:var(--accent-soft);border-color:#6c42eb44}
#imd .met.hero .n{color:var(--accent)}
#imd .controls{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;background:var(--soft);border:1px solid var(--line);padding:12px}
#imd .lab{display:flex;justify-content:space-between;gap:8px;font-size:11px;margin-bottom:5px}
#imd .lab output{font:600 11px 'IBM Plex Mono',monospace;color:var(--text)}
#imd input[type=range]{appearance:none;width:100%;height:3px;margin:9px 0;background:var(--line);cursor:pointer}
#imd input[type=range]::-webkit-slider-thumb{appearance:none;width:15px;height:15px;border-radius:50%;background:var(--accent);border:3px solid var(--soft);box-shadow:0 0 0 1px var(--accent)}
#imd input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--accent);border:3px solid var(--soft);box-shadow:0 0 0 1px var(--accent)}
#imd input[type=number]{width:100%;padding:6px;border:1px solid var(--line);font:500 12px Geist,sans-serif;background:#fff;color:var(--text)}
#imd .note{margin:10px 0 0;color:var(--body);font-size:10.5px;line-height:1.5}
#imd .source{margin:9px 0 0;font-size:10px;color:var(--muted)}
#imd a{color:var(--accent);text-decoration:none}
#imd a:hover{text-decoration:underline}
#imd .chartwrap{height:200px;position:relative;margin:10px 0 0}
#imd .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:10px;color:var(--muted);margin-top:7px}
#imd .legend span{display:flex;gap:5px;align-items:center}
#imd .legend i{display:block;width:14px;height:2px;background:var(--accent)}
#imd .detail{padding:11px 12px;border-left:2px solid var(--accent);background:var(--accent-soft);margin-top:10px;font-size:11px;line-height:1.5}
#imd .detail b{color:var(--text)}
#imd .detail p{margin:4px 0 0}
#imd .detail .source{margin-top:5px}
#imd details{margin-top:12px;border:1px solid var(--line);padding:9px 12px}
#imd summary{font-size:11px;color:var(--accent);cursor:pointer}
#imd details .controls{margin-top:9px;border:0;padding:0;background:#fff;grid-template-columns:repeat(3,1fr)}
#imd .ft{height:31px;padding:0 17px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end}
#imd .brand{display:flex;align-items:center;gap:4px;color:var(--accent);font-size:12px;font-weight:600}
#imd .eye{width:15px;height:15px;display:block;flex:0 0 15px}
#imd .brand i{color:var(--text);font:600 italic 12px Geist,sans-serif}
@media(max-width:520px){#imd .hd{padding:18px 16px 12px}#imd .body{padding:0 16px 16px}#imd h2{font-size:23px}#imd .met{padding:9px}#imd .met .n{font-size:20px}#imd .controls{gap:10px}#imd details .controls{grid-template-columns:1fr}#imd .chartwrap{height:185px}}
#imd .journey{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;position:relative;padding-bottom:13px}#imd .stage{position:relative;padding:11px 9px;text-align:left;background:var(--stage-bg);border-color:color-mix(in srgb,var(--stage-ink) 28%,white);transition:transform .2s,border-color .2s;display:flex;flex-direction:column;gap:14px}#imd .stage:not(:nth-child(5)):after{content:'→';position:absolute;right:-11px;top:37px;z-index:1;font:500 13px Geist,sans-serif;color:var(--accent)}#imd .stage:hover{transform:translateY(-2px)}#imd .stage.on{background:var(--stage-bg);border-color:var(--stage-ink);color:var(--stage-ink)}#imd .stage-top{display:flex;align-items:center;justify-content:space-between}#imd .stage-number{font:500 8px 'IBM Plex Mono',monospace;color:var(--stage-ink)}#imd .stage-icon{font-size:23px;line-height:1;color:var(--stage-ink)}#imd .stage-copy b{display:block;font:700 17px/1.15 Geist,sans-serif;letter-spacing:-.035em;color:var(--text)}#imd .stage-copy small{font:400 9px/1.3 Geist,sans-serif;display:block;margin-top:5px;color:var(--body)}#imd #indicator{position:absolute;bottom:4px;height:3px;background:var(--accent);pointer-events:none;transition:transform .4s cubic-bezier(.2,1.2,.4,1),width .4s;left:0}#imd .stage-sheet{padding:15px;border:1px solid var(--line);background:linear-gradient(120deg,#fcfaff,#fff);margin-top:2px}#imd .sheet-top{display:flex;justify-content:space-between;font:500 8px 'IBM Plex Mono',monospace;color:var(--accent);letter-spacing:.06em}#imd .stage-sheet h3{font:700 19px/1.15 Geist,sans-serif;letter-spacing:-.025em;color:var(--text);margin:8px 0}#imd .stage-sheet p{font-size:11px;line-height:1.5;margin:0 0 10px}#imd #stage-source{font-size:10px}#imd .sheet-enter{animation:stage-enter .3s cubic-bezier(.2,1.2,.4,1)}#imd #mini-flow{display:flex;align-items:center;gap:9px;margin:9px 0 12px;font-size:10px}#imd #mini-flow span{background:#edf9f3;border:1px solid #d3eadc;padding:5px 10px;color:#15764c}#imd #mini-flow i{font-style:normal;color:var(--muted)}#imd .branch-choices{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}#imd .branch-choices button{text-align:left;background:var(--soft);padding:10px}#imd .branch-choices button.on{background:var(--accent-soft)}#imd .branch-choices b{display:block;font:700 21px/1.1 Geist,sans-serif;color:var(--accent)}#imd .branch-choices span{font-size:10px;display:block;margin-top:5px}#imd .branch-sheet{border-left:2px solid var(--accent);padding:10px 12px;background:var(--accent-soft);margin-top:10px}#imd .branch-sheet b{font-size:12px;color:var(--text)}#imd .branch-sheet p{margin:5px 0 7px}#imd .branch-sheet a{font-size:10px}#imd .navigation{display:flex;align-items:center;justify-content:space-between;margin-top:10px}#imd .navigation span{font-size:9px;color:var(--muted)}#imd .navigation button{padding:4px 10px}#imd .navigation button:disabled{opacity:.3;cursor:default}#imd [hidden]{display:none!important}@keyframes stage-enter{from{opacity:.45;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(max-width:520px){#imd .journey{grid-template-columns:1fr;padding-left:9px;padding-bottom:0;gap:7px}#imd .stage{flex-direction:row;gap:12px;align-items:center;padding:9px 12px}#imd .stage-top{width:48px;flex:0 0 48px}#imd .stage-copy b{font-size:16px}#imd .stage-copy small{margin-top:2px}#imd .stage:not(:nth-child(5)):after{display:none}#imd #indicator{width:3px!important;bottom:auto;top:0;height:45px;transition:transform .4s cubic-bezier(.2,1.2,.4,1),height .4s}#imd .stage-sheet{margin-top:12px;padding:12px}#imd .stage-sheet h3{font-size:18px}#imd .branch-choices b{font-size:18px}#imd .branch-choices button{padding:9px 7px}}@media(prefers-reduced-motion:reduce){#imd #indicator,#imd .stage{transition:none}#imd .sheet-enter{animation:none}}#imd .hd{padding:14px 16px 10px}#imd h2{font-size:21px;margin:5px 0}#imd .sub{font-size:11px}#imd .body{padding:0 16px 12px}#imd .journey{gap:8px;padding:0 0 9px;grid-template-columns:repeat(5,1fr)}#imd .stage{padding:7px 9px;gap:5px;flex-direction:column;align-items:stretch}#imd .stage-top{width:auto;flex:none}#imd .stage-icon{font-size:16px}#imd .stage-number{font-size:7px}#imd .stage-copy b{font-size:14px;line-height:1.2}#imd .stage-copy small{display:none}#imd .stage:not(:nth-child(5)):after{display:block;top:21px;right:-9px;font-size:11px}#imd #indicator{height:2px!important;top:auto;bottom:2px;width:var(--indicator-width)!important}#imd .stage-sheet{margin:0;padding:9px 11px;border:0;border-left:2px solid var(--accent);background:#faf8ff}#imd .sheet-top{font-size:7px}#imd .stage-sheet h3{font-size:15px;line-height:1.25;margin:5px 0}#imd .stage-sheet p{font-size:11px;line-height:1.45;margin:0 0 6px}#imd #stage-source{font-size:9px}#imd .navigation{display:none}#imd .note{font-size:9px;line-height:1.4;margin-top:9px}#imd .source{font-size:8px;margin-top:6px}#imd #mini-flow{margin:5px 0 7px;gap:6px;font-size:9px}#imd #mini-flow span{padding:3px 7px}#imd .branch-choices{gap:6px;margin-top:8px;padding-top:8px}#imd .branch-choices button{display:flex;align-items:center;gap:7px;padding:7px 8px}#imd .branch-choices b{font-size:16px}#imd .branch-choices span{margin:0;font-size:9px}#imd .branch-sheet{padding:8px 10px;margin-top:7px}#imd .branch-sheet b{font-size:11px}#imd .branch-sheet a{font-size:9px}@media(max-width:520px){#imd .stage{padding:7px 5px;gap:5px}#imd .stage-copy b{font-size:12px}#imd .stage-top{width:auto;flex:none}#imd .stage-icon{font-size:14px}#imd #indicator{height:2px!important;width:var(--indicator-width)!important}#imd .branch-choices button{flex-direction:column;align-items:flex-start;gap:3px}#imd .branch-choices b{font-size:15px}}</style></head><body><div id="imd"><div class="hd"><div class="kick">IMD · protocol in five steps</div><h2>From request to reward</h2><p class="sub">Click a step to see how it works.</p></div><div class="body"><div class="journey" id="journey" aria-label="Five protocol stages"><button class="stage" data-step="0" style="--stage-bg:#edf4ff;--stage-ink:#315e9c" aria-pressed="false"><span class="stage-top"><span class="stage-number">01</span><span class="stage-icon" aria-hidden="true">↗</span></span><span class="stage-copy"><b>Request</b><small>A result</small></span></button><button class="stage" data-step="1" style="--stage-bg:#f2edff;--stage-ink:#6c42eb" aria-pressed="false"><span class="stage-top"><span class="stage-number">02</span><span class="stage-icon" aria-hidden="true">≋</span></span><span class="stage-copy"><b>Pay IMD</b><small>Fund the work</small></span></button><button class="stage" data-step="2" style="--stage-bg:#edf9f3;--stage-ink:#15764c" aria-pressed="false"><span class="stage-top"><span class="stage-number">03</span><span class="stage-icon" aria-hidden="true">✳</span></span><span class="stage-copy"><b>SWARM</b><small>Build & review</small></span></button><button class="stage" data-step="3" style="--stage-bg:#edf4ff;--stage-ink:#315e9c" aria-pressed="false"><span class="stage-top"><span class="stage-number">04</span><span class="stage-icon" aria-hidden="true">▧</span></span><span class="stage-copy"><b>Output</b><small>Use the result</small></span></button><button class="stage" data-step="4" style="--stage-bg:#fff6e5;--stage-ink:#93620e" aria-pressed="false"><span class="stage-top"><span class="stage-number">05</span><span class="stage-icon" aria-hidden="true">↳</span></span><span class="stage-copy"><b>Rewards</b><small>Several streams</small></span></button><span id="indicator" aria-hidden="true"></span></div><div class="stage-sheet" id="sheet" aria-live="polite"><div class="sheet-top"><span id="stage-kicker"></span><span id="position"></span></div><h3 id="stage-title"></h3><p id="stage-description"></p><div id="mini-flow" hidden><span>Build</span><i>→</i><span>Review</span><i>→</i><span>Publish</span></div><a id="stage-source" target="_blank" rel="noopener"></a><div id="reward-paths" hidden><div class="branch-choices" aria-label="Reward mechanisms"><button data-branch="0" aria-pressed="false"><b>10%</b><span>Launch tokens</span></button><button data-branch="1" aria-pressed="false"><b>1.25%</b><span>Market fees</span></button><button data-branch="2" aria-pressed="false"><b>85 / 15</b><span>POOL4</span></button></div><div class="branch-sheet" id="branch-sheet" hidden></div></div></div><div class="navigation"><button id="previous" aria-label="Previous stage">←</button><span>Explore a stage above</span><button id="next" aria-label="Next stage">→</button></div><p class="note">Launches are optional; POOL4 runs separately. Allocations and treasury policy do not set a fixed per-job wage.</p><p class="source">Rules and sources checked · 12 Oct 2026.</p></div><div class="ft"><span class="brand"><img class="eye" src="https://research.moni.ai/assets/logo-eye.svg" alt=""><span>moni</span><i>research</i></span></div></div><script>(()=>{const steps=[{"label": "Request", "tag": "A result", "color": "#edf4ff", "ink": "#315e9c", "icon": "\u2197", "title": "Request a result", "text": "Customers can request code, a site, a contract or an oracle answer without buying a worker NFT.", "url": "https://api.imd.fun/requests/capabilities", "source": "Request capabilities"}, {"label": "Pay IMD", "tag": "Fund the work", "color": "#f2edff", "ink": "#6c42eb", "icon": "\u224b", "title": "Pay for the request", "text": "A standard request costs 0.5 IMD; scheduled requests charge per run. Designated protocol roles handle payment and coordination.", "url": "https://api.imd.fun/requests/capabilities", "source": "Payment rules"}, {"label": "SWARM", "tag": "Build & review", "color": "#edf9f3", "ink": "#15764c", "icon": "\u2733", "title": "Workers build, review and publish", "text": "NFT operators provide compute and model access. Work is reviewed and verified before publication. Coordination still relies on trusted roles.", "url": "https://github.com/Identity-md/worker", "source": "Worker implementation"}, {"label": "Output", "tag": "Use the result", "color": "#edf4ff", "ink": "#315e9c", "icon": "\u25a7", "title": "Apps can return for more work", "text": "Customers receive an app, code, a deployment or an oracle answer. Apps can buy updates and further work, though a completed build says little about whether users stay.", "url": "https://github.com/Identity-md/awesome-imd", "source": "Ecosystem directory"}, {"label": "Rewards", "tag": "Several streams", "color": "#fff6e5", "ink": "#93620e", "icon": "\u21b3", "title": "Operators receive IMD and launch tokens", "text": "IMD payouts can be checked onchain. Launches allocate tokens to workers, while project trading fees can return to the network. Payout timing and treasury routing can change.", "url": "https://etherscan.io/tx/0xfc67922138d7af3a53596ff46497f88c72444425a989fe6e1cdcc1135557e55f", "source": "Confirmed IMD distribution"}];const branches=[{"label": "Launch tokens", "number": "10%", "title": "Work and connected seats", "text": "Standard launches reserve 2% of supply for wallets with eligible accepted work and 8% for seats connected at admission. Tokens must unlock before they can be claimed. Idle NFTs do not earn connection rewards.", "url": "https://eth.blockscout.com/address/0xff03410d0fe5fa8f7f59f743de35e333d9857120", "source": "ProjectFactory code"}, {"label": "Market fees", "number": "1.25%", "title": "Project trading fees", "text": "Standard pools charge 1.25%. The requester receives 80% of collected fees and the network receives 20%. Custom hooks can use other rules; treasury policy determines further payouts or burns.", "url": "https://eth.blockscout.com/address/0x12c9e1007262afac205567457f5826a9416a3863", "source": "LaunchFees code"}, {"label": "POOL4", "number": "85 / 15", "title": "How POOL4 splits trimmed inventory", "text": "POOL4 trims excess inventory. It routes 85% toward burning and 15% toward rewards: 4.5% for stakers, 6% for the bonding reserve and 4.5% for the NFT reserve. Tokens still need to be destroyed, and reserves still need to be paid out.", "url": "https://pool4.imd.fun/docs", "source": "POOL4 documentation"}];const $=id=>document.getElementById(id);let current=0,branch=-1;function move(){const b=document.querySelector('[data-step="'+current+'"]'),j=$('journey');if(false){$('indicator').style.transform='translateY('+b.offsetTop+'px)';$('indicator').style.height=b.offsetHeight+'px';}else{$('indicator').style.transform='translateX('+b.offsetLeft+'px)';$('indicator').style.width=b.offsetWidth+'px';$('indicator').style.setProperty('--indicator-width',b.offsetWidth+'px');$('indicator').style.height='3px';}}function showBranch(i){branch=i;const b=branches[i];$('branch-sheet').hidden=false;$('branch-sheet').innerHTML='<b>'+b.title+'</b><p>'+b.text+'</p><a href="'+b.url+'" target="_blank" rel="noopener">'+b.source+' ↗</a>';document.querySelectorAll('[data-branch]').forEach(el=>{const on=Number(el.dataset.branch)===i;el.classList.toggle('on',on);el.setAttribute('aria-pressed',String(on));});}function show(i){current=i;const s=steps[i];$('stage-kicker').textContent='0'+(i+1)+' / '+s.label.toUpperCase();$('position').textContent=(i+1)+' OF 5';$('stage-title').textContent=s.title;$('stage-description').textContent=s.text;$('stage-source').href=s.url;$('stage-source').textContent=s.source+' ↗';$('mini-flow').hidden=i!==2;$('reward-paths').hidden=i!==4;$('previous').disabled=i===0;$('next').disabled=i===4;document.querySelectorAll('[data-step]').forEach(b=>{const on=Number(b.dataset.step)===i;b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on));});$('sheet').classList.remove('sheet-enter');void $('sheet').offsetWidth;$('sheet').classList.add('sheet-enter');move();}document.querySelectorAll('[data-step]').forEach(b=>{b.onclick=()=>show(Number(b.dataset.step));b.onkeydown=e=>{if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();const forward=['ArrowRight','ArrowDown'].includes(e.key),i=Math.max(0,Math.min(4,current+(forward?1:-1)));show(i);document.querySelector('[data-step="'+i+'"]').focus();}};});document.querySelectorAll('[data-branch]').forEach(b=>b.onclick=()=>showBranch(Number(b.dataset.branch)));$('next').onclick=()=>show(Math.min(4,current+1));$('previous').onclick=()=>show(Math.max(0,current-1));window.addEventListener('resize',move);document.fonts.ready.then(move);show(0);window.IMDStepper={steps,branches};})();</script><script>
(() => {
 const root=document.getElementById('imd');
 if(!root || window.parent===window)return;
 const reportHeight=()=>{const box=root.getBoundingClientRect(),last=root.lastElementChild?.getBoundingClientRect();const height=Math.max(1,Math.floor((last?.bottom??box.bottom)-box.top)-2);window.parent.postMessage({type:'moni-widget:resize',height},'https://research.moni.ai');};
 new ResizeObserver(reportHeight).observe(root);
 window.addEventListener('load',reportHeight,{once:true});window.addEventListener('resize',reportHeight);
 window.addEventListener('message',e=>{if(e.origin==='https://research.moni.ai'&&e.data?.type==='moni-widget:request-resize')reportHeight();});
 [0,100,500,1500].forEach(t=>setTimeout(reportHeight,t));
})();
</script></body></html>
