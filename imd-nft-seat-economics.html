<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>From agent work to a claimed reward В· Moni research</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"><style>
html,body{margin:0;padding:0;background:transparent}
#imd{--bg:#ffffff;--soft:#fafafb;--text:#14151a;--body:#3b4049;--muted:#8b8f99;--line:#e8e8ed;--accent:#6c42eb;--accent-soft:#6c42eb14;--emerald:#0fa968;font-family:Geist,system-ui,sans-serif;color:var(--body);background:var(--bg);width:100%;max-width:none;overflow:hidden;line-height:1.5}
#imd *{box-sizing:border-box;min-width:0}
#imd .hd{padding:20px 22px 14px}
#imd .kick{font:600 9px/1.2 'IBM Plex Mono',monospace;letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
#imd h2{margin:7px 0 6px;font:700 25px/1.12 Geist,sans-serif;letter-spacing:-.025em;color:var(--text)}
#imd .sub{margin:0;font-size:12px;line-height:1.45}
#imd .body{padding:0 22px 18px}
#imd .tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
#imd button{font:500 11px/1.3 Geist,sans-serif;padding:7px 10px;border:1px solid var(--line);background:var(--bg);color:var(--body);cursor:pointer}
#imd button:hover{border-color:var(--accent)}
#imd button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
#imd button:focus-visible,#imd input:focus-visible,#imd summary:focus-visible,#imd a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#imd .mets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
#imd .met{border:1px solid var(--line);padding:11px 12px;background:var(--bg)}
#imd .met .l{font-size:10px;color:var(--muted)}
#imd .met .n{font:700 23px/1.25 Geist,sans-serif;color:var(--text);letter-spacing:-.025em;margin-top:4px;overflow-wrap:anywhere}
#imd .met.hero{background:var(--accent-soft);border-color:#6c42eb44}
#imd .met.hero .n{color:var(--accent)}
#imd .controls{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;background:var(--soft);border:1px solid var(--line);padding:12px}
#imd .lab{display:flex;justify-content:space-between;gap:8px;font-size:11px;margin-bottom:5px}
#imd .lab output{font:600 11px 'IBM Plex Mono',monospace;color:var(--text)}
#imd input[type=range]{appearance:none;width:100%;height:3px;margin:9px 0;background:var(--line);cursor:pointer}
#imd input[type=range]::-webkit-slider-thumb{appearance:none;width:15px;height:15px;border-radius:50%;background:var(--accent);border:3px solid var(--soft);box-shadow:0 0 0 1px var(--accent)}
#imd input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--accent);border:3px solid var(--soft);box-shadow:0 0 0 1px var(--accent)}
#imd input[type=number]{width:100%;padding:6px;border:1px solid var(--line);font:500 12px Geist,sans-serif;background:#fff;color:var(--text)}
#imd .note{margin:10px 0 0;color:var(--body);font-size:10.5px;line-height:1.5}
#imd .source{margin:9px 0 0;font-size:10px;color:var(--muted)}
#imd a{color:var(--accent);text-decoration:none}
#imd a:hover{text-decoration:underline}
#imd .chartwrap{height:200px;position:relative;margin:10px 0 0}
#imd .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:10px;color:var(--muted);margin-top:7px}
#imd .legend span{display:flex;gap:5px;align-items:center}
#imd .legend i{display:block;width:14px;height:2px;background:var(--accent)}
#imd .detail{padding:11px 12px;border-left:2px solid var(--accent);background:var(--accent-soft);margin-top:10px;font-size:11px;line-height:1.5}
#imd .detail b{color:var(--text)}
#imd .detail p{margin:4px 0 0}
#imd .detail .source{margin-top:5px}
#imd details{margin-top:12px;border:1px solid var(--line);padding:9px 12px}
#imd summary{font-size:11px;color:var(--accent);cursor:pointer}
#imd details .controls{margin-top:9px;border:0;padding:0;background:#fff;grid-template-columns:repeat(3,1fr)}
#imd .ft{height:31px;padding:0 17px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end}
#imd .brand{display:flex;align-items:center;gap:4px;color:var(--accent);font-size:12px;font-weight:600}
#imd .eye{width:15px;height:15px;display:block;flex:0 0 15px}
#imd .brand i{color:var(--text);font:600 italic 12px Geist,sans-serif}
@media(max-width:520px){#imd .hd{padding:18px 16px 12px}#imd .body{padding:0 16px 16px}#imd h2{font-size:23px}#imd .met{padding:9px}#imd .met .n{font-size:20px}#imd .controls{gap:10px}#imd details .controls{grid-template-columns:1fr}#imd .chartwrap{height:185px}}
#imd .loop{display:grid;grid-template-columns:1fr 16px 1fr 16px 1fr;align-items:center;margin:0 0 16px}#imd .loop-box{padding:12px 10px;border:1px solid}#imd .blue{background:#edf4ff;border-color:#bfd4ef}#imd .green{background:#edf9f3;border-color:#b9dfcc}#imd .purple{background:#f2edff;border-color:#c9b9fa}#imd .loop span{font:500 7px 'IBM Plex Mono',monospace;display:block;color:var(--muted)}#imd .loop b{display:block;font-size:15px;color:var(--text);margin:6px 0}#imd .loop small{font-size:9px;line-height:1.4;display:block}#imd .loop i{font-style:normal;text-align:center;color:var(--muted)}#imd .stream button{flex:1}#imd .big{padding:18px;border:1px solid #c9b9fa;background:#f2edff}#imd .big .label{font:500 8px 'IBM Plex Mono',monospace;color:var(--accent);letter-spacing:.08em}#imd .big strong{display:block;font:700 38px/1.15 Geist,sans-serif;color:var(--accent);margin:6px 0;letter-spacing:-.03em}#imd .big strong em{font-size:19px;font-style:normal}#imd .big p{font-size:11px;margin:5px 0 0}#imd .rows{margin-top:12px}#imd .pay-row{display:grid;grid-template-columns:88px 1fr 92px 15px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:11px}#imd .pay-row small{font-size:8px;display:block;color:var(--muted)}#imd .pay-row b{font-size:15px;text-align:right;color:var(--text)}#imd .bar{height:8px;background:#f0edf7}#imd .bar i{display:block;height:100%;background:var(--accent)}#imd .split{display:flex;margin-top:15px;height:55px}#imd .split div{display:flex;flex-direction:column;justify-content:center;padding:0 10px;font-size:10px}#imd .split .work{width:20%;background:#6c42eb;color:white}#imd .split .capacity{width:80%;background:#e9e0ff;color:#50329b}#imd .split b{font-size:20px}#imd .explain{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}#imd .explain div{border:1px solid var(--line);padding:10px;font-size:11px}#imd .explain b{display:block;color:var(--text);font-size:16px}#imd .caption{font-size:11px;margin:12px 0 0}#imd .proof{font-size:10px;margin-top:9px}@media(max-width:520px){#imd .loop b{font-size:13px}#imd .loop-box{padding:10px 7px}#imd .loop small{font-size:8px}#imd .loop span{font-size:6px}#imd .big strong{font-size:34px}#imd .pay-row{grid-template-columns:76px 1fr 75px 12px;gap:6px}#imd .pay-row b{font-size:13px}#imd .split div{padding:0 7px}#imd .split b{font-size:17px}}
#imd .case-flow{display:grid;grid-template-columns:1fr 18px 1fr;align-items:center;gap:8px;margin-bottom:12px}
#imd .case-card{padding:14px;border:1px solid #b9dfcc;background:#edf9f3}
#imd .case-card.purple{border-color:#c9b9fa;background:#f2edff}
#imd .case-card span{font:500 8px 'IBM Plex Mono',monospace;letter-spacing:.06em;color:var(--muted)}
#imd .case-card h3{font-size:17px;line-height:1.2;letter-spacing:-.025em;margin:8px 0;color:var(--text)}
#imd .case-card p{font-size:11px;margin:0}
#imd .case-flow>i{font-style:normal;text-align:center;color:var(--accent)}
#imd .allocation{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
#imd .allocation>div{border:1px solid var(--line);padding:10px;font-size:10px}
#imd .allocation b{display:block;font-size:19px;color:var(--text);margin:3px 0}
#imd .claim-status{color:var(--emerald);font-size:10px;font-weight:600}
#imd .wallet{font:500 9px 'IBM Plex Mono',monospace;overflow-wrap:anywhere}
#imd .proof-list{font-size:10px;line-height:1.6;margin:8px 0 0}
@media(max-width:520px){#imd .case-card{padding:11px}#imd .case-card h3{font-size:15px}#imd .allocation b{font-size:17px}}
</style></head><body><div id="imd"><div class="hd"><div class="kick">IMD В· network economics</div><h2>From agent work to a claimed reward</h2><p class="sub">A real INFER contributor, its reward allocation and the executed claim.</p></div><div class="body"><div class="tabs stream"><button class="on" data-stream="infer">INFER case</button><button data-stream="payments">IMD payouts</button><button data-stream="launches">Launch rules</button><button data-stream="fees">Trading fees</button></div><div id="stream-content" aria-live="polite"></div><p class="note">Checked 12 Oct 2026. IMD payouts and launch-token rewards cover different units and periods.</p><p class="source"><a href="https://eth.blockscout.com/address/0xff03410d0fe5fa8f7f59f743de35e333d9857120" target="_blank" rel="noopener">Reward rules в†—</a></p></div><div class="ft"><span class="brand"><img class="eye" src="https://research.moni.ai/assets/logo-eye.svg" alt=""><span>moni</span><i>research</i></span></div></div><script>(()=>{const data={"total": "9156.499999999999999320", "amounts": ["1760.499999999999999950", "3221.999999999999999872", "4173.999999999999999498"], "hashes": ["0x960e191b859b90dfd490c2b4f4411cf5c385ed72511edf6e5cf1a1326db19351", "0x4cb7223a65e592d711999ebf6b6e4666cb396295c9a9bb201fda52b294c2d7ba", "0x626a0e757f3ee4e85fea270bca3961bbc0c4880b908a2bf6d1e02abccf7d2061"]};const $=id=>document.getElementById(id),fmt=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:2});function show(s){let content='';if(s==='infer'){content="<div class=\"case-flow\"><div class=\"case-card\"><span>01 / RECORDED WORK</span><h3>Economics review</h3><p>The launch snapshot records an economics review contribution from this agent.</p></div><i>\u2192</i><div class=\"case-card purple\"><span>02 / REWARD ELIGIBILITY</span><h3>Work + one seat</h3><p>The wallet qualifies as one of 13 work wallets and holds one of 886 connected seats.</p></div></div><div class=\"big\"><span class=\"label\">03 / EXECUTED ETHEREUM CLAIM</span><strong>1,628,754.99 <em>INFER</em></strong><p class=\"claim-status\">\u2713 Tokens received by the operator wallet</p></div><div class=\"allocation\"><div>For accepted work<b>1,538,461.54 INFER</b>20M work tokens \u00f7 13 wallets</div><div>For the connected seat<b>90,293.45 INFER</b>80M connection tokens \u00f7 886 seats</div></div><p class=\"caption\">This launch paid the operator in INFER tokens. The total combines work and connection rewards; it is not a price for one review. Sale proceeds and operating costs are unknown.</p><p class=\"proof\"><a target=\"_blank\" rel=\"noopener\" href=\"https://api.imd.fun/launches/63f6d974-f5b8-4a84-b296-2219f5ab2c95\">Role & allocation \u2197</a> \u00b7 <a target=\"_blank\" rel=\"noopener\" href=\"https://etherscan.io/tx/0xd3196544f1a200fe532fd7589c1825917adc1ad6b01f1281b04b7da7808471ab\">Verify the executed claim \u2197</a></p><details><summary>Which agent and what was verified?</summary><div class=\"proof-list\">Operator wallet: <span class=\"wallet\">0x3a9436134db40a6a210eb642b3c495b30e082ee4</span><br>Recorded role: <b>audit_economics</b><br>Recorded job: <span class=\"wallet\">b0d8cce2-431c-45ab-8eec-c125b83b4548</span><br>The launch snapshot records the work role and allocation. Ethereum logs confirm the transfer from the INFER distributor to this wallet. The underlying review report was not independently assessed.</div></details>";}else if(s==='payments'){content='<div class="big"><span class="label">CONFIRMED IMD TRANSFERS В· 2вЂ“12 OCT</span><strong>'+fmt(data.total)+' <em>IMD</em></strong><p>Three October batches from the same distribution wallet used for the September payouts. Transfers were checked on Ethereum.</p></div><div class="rows">'+data.amounts.map((a,i)=>'<div class="pay-row"><span>'+['2 Oct','6 Oct','12 Oct'][i]+'<small>'+[217,263,483][i]+' recipient wallets</small></span><div class="bar"><i style="width:'+Number(a)/4174*100+'%"></i></div><b>'+fmt(a)+'</b><a href="https://etherscan.io/tx/'+data.hashes[i]+'" target="_blank" rel="noopener" aria-label="Verify payout">в†—</a></div>').join('')+'</div><p class="caption">The latest batch sent 4,174 IMD to 483 wallets on 12 October. These transfers confirm continued distribution; the logs do not map each payment to a specific job. The total covers these three batches only.</p>';}else if(s==='launches'){content='<div class="big"><span class="label">STANDARD LAUNCH RULE</span><strong>10% <em>of token supply</em></strong><p>Allocated to wallets with accepted work and seats connected at admission.</p></div><div class="split"><div class="work"><b>2%</b>Work</div><div class="capacity"><b>8%</b>Connected seats</div></div><div class="explain"><div><b>9 work wallets</b>20M SCOOP allocated equally</div><div><b>986 seats</b>80M SCOOP allocated by connection</div></div><p class="caption">SCOOP shows this split in a recorded launch. Tokens unlock before claim. A separate operator claimed 1,217,038.54 SCOOP; the amount received from selling them is unknown.</p><p class="proof"><a target="_blank" rel="noopener" href="https://api.imd.fun/launches/3b82f412-3bdc-49d9-9cb7-c47adf9febcf">SCOOP allocation в†—</a> В· <a target="_blank" rel="noopener" href="https://etherscan.io/tx/0x3134cf176766732d20741ab9f5c7852ea108115c057e196e0e7fa8daaf6771cf">Executed claim в†—</a></p>';}else{content='<div class="big"><span class="label">STANDARD PROJECT POOL В· CURRENT RULE</span><strong>1.25% <em>trading fee</em></strong><p>Collected assets split 80% to the requester and 20% to the network.</p></div><div class="explain"><div><b>1% of volume</b>Requester share, equivalent asset value</div><div><b>0.25% of volume</b>Network share, equivalent asset value</div></div><p class="caption">Trading generates fees for the network. Treasury policy determines whether those fees fund worker payouts or burns. Custom hooks may use different rules.</p><p class="proof"><a target="_blank" rel="noopener" href="https://eth.blockscout.com/address/0x12c9e1007262afac205567457f5826a9416a3863">Inspect LaunchFees в†—</a></p>';}$('stream-content').innerHTML=content;document.querySelectorAll('[data-stream]').forEach(b=>{const on=b.dataset.stream===s;b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on));});}document.querySelectorAll('[data-stream]').forEach(b=>b.onclick=()=>show(b.dataset.stream));window.IMDNetworkRewards={data};show('infer');})();</script><script>
(() => {
 const root=document.getElementById('imd');
 if(!root || window.parent===window)return;
 const reportHeight=()=>{const box=root.getBoundingClientRect(),last=root.lastElementChild?.getBoundingClientRect();const height=Math.max(1,Math.floor((last?.bottom??box.bottom)-box.top)-2);window.parent.postMessage({type:'moni-widget:resize',height},'https://research.moni.ai');};

 window.addEventListener('message',e=>{if(e.origin==='https://research.moni.ai'&&e.data?.type==='moni-widget:request-resize')reportHeight();});

})();
